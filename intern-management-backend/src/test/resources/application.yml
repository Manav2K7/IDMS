# Test profile: H2 in PostgreSQL-compatibility mode so integration tests run
# with no external database. Never mirrors real credentials.
spring:
  datasource:
    url: jdbc:h2:mem:internmgmt_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  # Tests build their schema from the entities on H2, so the PostgreSQL
  # migration scripts are intentionally not run here.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

app:
  cors:
    allowed-origins: http://localhost:4200
  security:
    jwt:
      # Placeholder only — tests never exercise JWT signing (no auth yet).
      secret: test-only-secret-not-used-for-signing-anything-real-0123456789
      expiration-ms: 86400000
